[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "roiextract"
dynamic = ["version"]
authors = [
    { name="Nikolai Kapralov", email="kapralov@cbs.mpg.de" }
]
description = "Data-independent and data-driven optimization of spatial filters for extraction of ROI time series based on M/EEG"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "adaptive",
    "numpy",
    "mne",
    "nibabel >= 2.0",  # reading parcellations
    "scipy"
]

[project.urls]
"Homepage" = "https://github.com/ctrltz/roiextract"
"Bug Tracker" = "https://github.com/ctrltz/roiextract/issues"

[project.optional-dependencies]
dev = [
    "mne-connectivity",
    "mock",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "scipy-stubs",
]
docs = [
    "intersphinx-registry",
    "numpydoc",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinxcontrib-bibtex"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = [
    "tests",
]
addopts = "--cov=src/roiextract --cov-report term-missing"

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    "docs"
]

[tool.ruff.lint]
ignore = [
    "C408"
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
